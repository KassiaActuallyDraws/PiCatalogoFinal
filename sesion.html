<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Duck-EE</title>

    <link rel="stylesheet"
          href="css/estilo-admin.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Edu+AU+VIC+WA+NT+Guides:wght@500&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="registro-container">

    <h2 class="form-title">

        Duck-EE

    </h2>

    <form id="loginForm">

        <!-- Usuario -->

        <div class="form-group">

            <label for="txt-usuario">

                Usuario:

            </label>

            <input
                type="text"
                id="txt-usuario"
                maxlength="30"
                placeholder="Ingresa tu usuario"
                required>

        </div>

        <!-- Contraseña -->

        <div class="form-group">

            <label for="txt-contrasena">

                Contraseña:

            </label>

            <input
                type="password"
                id="txt-contrasena"
                placeholder="********"
                required>

        </div>

        <div class="btn-register-container">

            <button
                type="submit"
                class="btn-register">

                Iniciar sesión

            </button>

        </div>

        <div class="link-crear">

            ¿No tienes cuenta?

            <br><br>

            <a href="crear.html">

                <b>Crear cuenta</b>

            </a>

        </div>

    </form>

</div>

<script src="js/login.js"></script>

</body>

</html>
