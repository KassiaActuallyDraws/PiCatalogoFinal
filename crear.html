<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Duck-EE</title>

    <link rel="stylesheet" href="css/estilo-admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Edu+AU+VIC+WA+NT+Guides:wght@500&display=swap" rel="stylesheet">

</head>

<body>

<div class="registro-container">

    <h2 class="form-title">

        Duck-EE

    </h2>

    <form id="registroForm">

        <!-- Usuario -->

        <div class="form-group">

            <label for="txt-usuario">

                Usuario

            </label>

            <input
                type="text"
                id="txt-usuario"
                maxlength="30"
                placeholder="Ej. usuario123"
                required>

        </div>

        <!-- Correo -->

        <div class="form-group">

            <label for="txt-correo">

                Correo

            </label>

            <input
                type="email"
                id="txt-correo"
                placeholder="correo@ejemplo.com"
                required>

        </div>

        <!-- Contraseña -->

        <div class="form-group">

            <label for="txt-contrasena">

                Contraseña

            </label>

            <input
                type="password"
                id="txt-contrasena"
                placeholder="********"
                required>

        </div>

        <div class="btn-register-container">

            <button
                type="submit"
                class="btn-register">

                Crear cuenta

            </button>

        </div>

        <div class="link-crear">

            ¿Ya tienes cuenta?

            <br><br>

            <a href="sesion.html">

                <b>Iniciar sesión</b>

            </a>

        </div>

    </form>

</div>

<script src="js/registro.js"></script>

</body>

</html>
