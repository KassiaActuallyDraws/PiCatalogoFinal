                <button id="btn-cerrar-sesion">Cerrar sesión</button>
            </div>

        <script>
            // Mostramos el nombre guardado; si no hay sesion, regresamos al login.
            const usuario = localStorage.getItem("usuario");
            if (usuario) {
                document.getElementById("saludo-perfil").textContent = "Hola, " + usuario + ". Bienvenido a tu Perfil.";
            } else {
                window.location.href = "sesion.html";
            }
            </script>

            <script>
            // Cerrar sesion: borramos el usuario y volvemos a la tienda.
            document.getElementById("btn-cerrar-sesion").addEventListener("click", function () {
                localStorage.removeItem("usuario");
                window.location.href = "tienda.html";
            });
        </script>
